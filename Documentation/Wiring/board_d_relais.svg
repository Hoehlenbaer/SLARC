<text x="294.0" y="74.0" class="small" text-anchor="start">Modul: Jumper JD-VCC–VCC ziehen!</text>
<text x="294.0" y="89.0" class="small" text-anchor="start">  VCC (Optokoppler) = 3,3 V über J1</text>
<text x="294.0" y="104.0" class="small" text-anchor="start">  JD-VCC (Spulen) = 5 V vom Treiber,</text>
<text x="294.0" y="119.0" class="small" text-anchor="start">  GND an der 3-pol. Leiste</text>
<text x="294.0" y="134.0" class="small" text-anchor="start">Eingänge aktiv-low, direkt an 3,3-V-Logik</text>
<text x="294.0" y="149.0" class="small" text-anchor="start">IN1 = K1 12 V → DC-DC (Pi)</text>
<text x="294.0" y="164.0" class="small" text-anchor="start">  ESP IO16 (Open-Drain) ODER Pi GPIO26</text>
<text x="294.0" y="179.0" class="small" text-anchor="start">  über Q1 (high = halten)</text>
<text x="294.0" y="194.0" class="small" text-anchor="start">IN2…IN7 = K2…K7 je ein Bein</text>
<text x="294.0" y="209.0" class="small" text-anchor="start">  FR MR RR FL ML RL, alle an IO27</text>
<text x="294.0" y="224.0" class="small" text-anchor="start">  (low = an, ~12 mA Senke)</text>
<text x="294.0" y="239.0" class="small" text-anchor="start">IN8 = K8 frei</text>
<text x="294.0" y="254.0" class="small" text-anchor="start">Q1 statt Direktanschluss für den Pi:</text>
<text x="294.0" y="269.0" class="small" text-anchor="start">  ein ausgeschalteter Pi zöge IN1 über</text>
<text x="294.0" y="284.0" class="small" text-anchor="start">  seinen Pin nach unten</text>
<text x="294.0" y="299.0" class="small" text-anchor="start">Reihenfolge der Modul-Leiste prüfen</text>
</svg>