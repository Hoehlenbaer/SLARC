; SLARC – ESP32-Firmware (Waveshare General Driver for Robots, ESP32-WROOM-32)
; Stand: V0.1 (02.11.2026) – Inbetriebnahme-Werkzeug, noch keine Regelung.

[env:slarc]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
